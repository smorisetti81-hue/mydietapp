name: Python syntax check

on:
  push:
    branches:
      - master
      - feature/manual-food-persistence
  pull_request:
    branches:
      - master

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m py_compile app.py db.py
